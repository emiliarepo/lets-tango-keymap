name: build

# On every push: compile the firmware, render the layer card, and publish a
# GitHub Release with both bundled as assets. PRs build but don't release.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile firmware (.hex)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AVR toolchain + QMK CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-avr avr-libc binutils-avr
          python3 -m pip install --user qmk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch QMK
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/qmk/qmk_firmware.git

      - name: Compile
        run: |
          export QMK_HOME="$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.qmk_home="$QMK_HOME"
          KM="$QMK_HOME/keyboards/vitamins_included/keymaps/colemak"
          mkdir -p "$KM"
          cp *.c *.h rules.mk "$KM/"
          qmk compile -kb vitamins_included/rev2 -km colemak

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-hex
          path: qmk_firmware/vitamins_included_rev2_colemak.hex
          if-no-files-found: error

  card:
    name: Render layer card (.pdf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Render card
        run: |
          python3 -m pip install reportlab
          python3 make_card.py

      - name: Upload layer card
        uses: actions/upload-artifact@v4
        with:
          name: layer-card
          path: colemak_layer_card.pdf
          if-no-files-found: error

  release:
    name: Publish release
    needs: [firmware, card]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the tag + release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist # -> dist/firmware-hex/*, dist/layer-card/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            Automated build.
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            ${{ github.event.head_commit.message }}
          files: dist/**/*
