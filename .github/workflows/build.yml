name: build

# On every push: compile the firmware and render the layer card for BOTH boards
# (tango + macropad), then publish a GitHub Release with all four assets bundled.
# PRs build but don't release.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Pinned deliberately. Two reasons: the .hex becomes reproducible (an unpinned
  # master means the firmware silently changes under you between releases), and the
  # QMK cache key below only pays off if it's stable -- master moves several times a
  # day, so keying on its HEAD would miss almost every run.
  # Bump when you want upstream fixes: github.com/qmk/qmk_firmware/releases
  QMK_REF: "0.33.11"

jobs:
  firmware:
    name: Compile firmware (${{ matrix.name }})
    runs-on: ubuntu-latest
    # QMK's official image: CLI and the AVR toolchain are already installed, which
    # replaces the apt-get + pip step entirely rather than caching it.
    container: ghcr.io/qmk/qmk_cli:1.2.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: tango,    km: colemak,  src: tango }
          - { name: macropad, km: macropad, src: macropad }
    steps:
      - uses: actions/checkout@v7

      # The container runs as root, so git refuses to touch the workspace otherwise.
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Cache QMK checkout
        id: qmk-cache
        uses: actions/cache@v6
        with:
          path: qmk_firmware
          key: qmk-${{ env.QMK_REF }}-lufa-v1

      - name: Fetch QMK
        if: steps.qmk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$QMK_REF" \
            https://github.com/qmk/qmk_firmware.git qmk_firmware
          # An AVR/LUFA board needs lib/lufa and nothing else. chibios,
          # chibios-contrib, pico-sdk and lvgl are ARM/RP2040/display-only and are
          # the bulk of what --recurse-submodules was downloading.
          git -C qmk_firmware submodule update --init --depth 1 lib/lufa

      - name: Compile
        env:
          QMK_HOME: ${{ github.workspace }}/qmk_firmware
          # Required. Without it, make runs `qmk git-submodule --sync`, which
          # submodule-updates every uninitialised submodule -- undoing the trimming
          # above and re-downloading chibios et al. at build time.
          SKIP_GIT: yes
        run: |
          KM="$QMK_HOME/keyboards/vitamins_included/keymaps/${{ matrix.km }}"
          mkdir -p "$KM"
          cp ${{ matrix.src }}/*.c ${{ matrix.src }}/*.h ${{ matrix.src }}/rules.mk "$KM/"
          qmk compile -kb vitamins_included/rev2 -km ${{ matrix.km }}

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-hex-${{ matrix.name }}
          path: qmk_firmware/vitamins_included_rev2_${{ matrix.km }}.hex
          if-no-files-found: error

  card:
    name: Render layer card (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: tango,    src: tango,    out: lets_tango_layer_card.pdf }
          - { name: macropad, src: macropad, out: macropad_card.pdf }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Render card
        env:
          BOARD_CONFIG: ${{ matrix.src }}/card.json
          KEYMAP_SRC: ${{ matrix.src }}/keymap.c
          CARD_OUT: ${{ matrix.out }}
        run: |
          python3 -m pip install reportlab
          python3 make_card.py

      - name: Upload layer card
        uses: actions/upload-artifact@v7
        with:
          name: layer-card-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [firmware, card]  # waits for all matrix legs of both jobs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the tag + release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist # -> dist/firmware-hex-{tango,macropad}/*, dist/layer-card-{tango,macropad}/*

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            Automated build.
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            QMK: ${{ env.QMK_REF }}

            ${{ github.event.head_commit.message }}
          files: dist/**/*
